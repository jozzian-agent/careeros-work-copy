<!-- @dsCard group="Status" height=110 subtitle="Brand and neutral" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body{margin:0;padding:24px;background:var(--ground);font-family:var(--font-sans);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-100);font:700 14px/17px var(--font-sans);white-space:nowrap}
.brand{background:var(--brand);color:var(--on-brand)}
.neutral{background:var(--fill-secondary);color:var(--ink)}
</style>
</head>
<body>
<span class="badge brand">Now</span>
<span class="badge brand">Early access from late Q4 2026</span>
<span class="badge neutral">Step 1</span>
<span class="badge neutral">Interested</span>
<span class="badge neutral">Later</span>
<span class="badge neutral">1</span>
</body>
</html>

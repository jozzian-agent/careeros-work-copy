<!-- @dsCard group="Surfaces" height=130 subtitle="Default and on brand" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body{margin:0;padding:24px;background:var(--ground);font-family:var(--font-sans);display:flex;flex-direction:column;gap:16px}
.t{font:700 16px/22px var(--font-sans);color:var(--ink)}
hr{border:0;height:1px;background:var(--border-decorative);margin:8px 0 0}
.panel{background:var(--brand);padding:16px;border-radius:var(--radius-600);color:var(--on-brand)}
.panel .t{color:var(--on-brand);font-weight:700}
.panel hr{background:rgba(255,255,255,.6)}
</style>
</head>
<body>
<div><div class="t">New</div><hr></div>
<div class="panel"><div class="t">Interested</div><hr></div>
</body>
</html>

<!-- @dsCard group="Surfaces" height=230 subtitle="Standard, highlighted and board job card" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body{margin:0;padding:24px;background:var(--ground);font-family:var(--font-sans);display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.card{box-sizing:border-box;width:240px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:24px;border:1px solid var(--border-decorative);border-radius:var(--radius-400);background:var(--surface);color:var(--ink)}
.card.hi{border:2px solid var(--brand)}
.card h3{margin:0;font:700 20px/24px var(--font-sans)}
.card p{margin:0;font:400 16px/22px var(--font-sans);color:var(--text-neutral)}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-100);font:700 14px/17px var(--font-sans)}
.brand{background:var(--brand);color:var(--on-brand)}
.neutral{background:var(--fill-secondary);color:var(--ink)}
.job{width:180px;padding:12px;gap:8px}
.job .t{font:700 16px/22px var(--font-sans)}
.job .c{font:400 14px/20px var(--font-sans);text-decoration:underline}
.job .m{font:400 14px/20px var(--font-sans);color:var(--text-subtle)}
</style>
</head>
<body>
<div class="card"><span class="badge neutral">Step 1</span><h3>Paste a job link</h3><p>Add a posting by its URL.</p></div>
<div class="card hi"><span class="badge brand">Now</span><h3>Closed testing</h3><p>A small group of invited testers.</p></div>
<div class="card job"><span class="badge neutral">New</span><span class="t">Product Designer</span><span class="c">Example Company</span><span class="m">Added today</span></div>
</body>
</html>

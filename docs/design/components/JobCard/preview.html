<!-- @dsCard group="Jobs board" height=250 subtitle="Needs input, standard, off-board" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body{margin:0;padding:24px;background:var(--ground);font-family:var(--font-sans);display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;color:var(--ink)}
.card{box-sizing:border-box;width:240px;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--border-decorative);border-radius:var(--radius-400);background:var(--surface)}
.top{min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--radius-pill);background:var(--violet-wash);color:var(--violet);border:1px solid var(--violet);font:700 12px/16px var(--font-sans)}
.sel{display:inline-flex;align-items:center;width:100px;height:32px;padding:0 10px;border:1px solid var(--border-interactive);border-radius:var(--radius-200);background:var(--surface);color:var(--ink);font:700 12px/16px var(--font-sans);margin-left:auto}
.t{font:700 16px/22px var(--font-sans)}
.c{font:700 14px/20px var(--font-sans);text-decoration:underline}
.m{display:inline-flex;align-items:center;gap:6px;font:400 14px/20px var(--font-sans);color:var(--text-subtle)}
.add{align-self:flex-start;min-height:32px;padding:4px 12px;border:0;border-radius:var(--radius-200);background:var(--fill-secondary);color:var(--ink);font:700 12px/16px var(--font-sans)}
</style>
</head>
<body>
<div class="card"><div class="top"><span class="chip">Needs your input</span><span class="sel">Interested</span></div><span class="t">Senior Growth Marketing Manager</span><span class="c">Example Company</span><span class="m"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Zurich · Added 14 Oct</span></div>
<div class="card"><div class="top"><span class="sel">New</span></div><span class="t">Product Designer</span><span class="c">Sample AG</span><span class="m">Bern · Added today</span></div>
<div class="card"><div class="top"><button class="add">Add to my jobs</button></div><span class="t">Data Analyst</span><span class="c">Demo GmbH</span><span class="m">Basel · Added yesterday</span></div>
</body>
</html>

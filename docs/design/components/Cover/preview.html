<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
html,body{margin:0}
body{background:var(--ground)}
.cover{position:relative;width:960px;height:288px;overflow:hidden;font-family:var(--font-sans)}
svg{position:absolute;left:0;top:0}
.brand{fill:var(--brand)}
.deep{fill:var(--brand-hover)}
.ink{fill:var(--ink)}
.soft{fill:var(--fill-secondary)}
.cut{fill:var(--ground)}
.slab{rx:var(--radius-400)}
.unit{rx:var(--radius-100)}
.text{position:absolute;left:40px;bottom:40px;width:440px}
.name{margin:0;font-size:80px;line-height:.95;font-weight:700;color:var(--ink);letter-spacing:0}
.tag{margin:12px 0 0;font-size:14px;line-height:20px;color:var(--text-subtle)}
</style>
</head>
<body>
<div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
blocks: brand 240x168 slab, brand-hover 168x96, ink 96x120, fill-secondary 48x120, brand 240x48 base (all multiples of space-6 = 24px)
arrangement: one tall brand slab left of a staggered stack of satellites, all right of x = 480, nothing crosses the name
pattern: modular tiles cut from the slab in ground colour, 24 units at a 24px pitch, rounded by radius-100; chosen because Gestalt is soft, modular and UI-tile based
steps and radii: space-6 pitch, radius-400 on blocks, radius-100 on tiles
-->
<rect class="brand slab" x="504" y="24" width="240" height="168"/>
<rect class="deep slab" x="768" y="24" width="168" height="96"/>
<rect class="ink slab" x="768" y="144" width="96" height="120"/>
<rect class="soft slab" x="888" y="144" width="48" height="120"/>
<rect class="brand slab" x="504" y="216" width="240" height="48"/>
<g class="cut">
<rect class="unit" x="528" y="48" width="12" height="12"/><rect class="unit" x="552" y="48" width="12" height="12"/><rect class="unit" x="576" y="48" width="12" height="12"/><rect class="unit" x="600" y="48" width="12" height="12"/><rect class="unit" x="624" y="48" width="12" height="12"/><rect class="unit" x="648" y="48" width="12" height="12"/>
<rect class="unit" x="528" y="72" width="12" height="12"/><rect class="unit" x="552" y="72" width="12" height="12"/><rect class="unit" x="576" y="72" width="12" height="12"/><rect class="unit" x="600" y="72" width="12" height="12"/><rect class="unit" x="624" y="72" width="12" height="12"/><rect class="unit" x="648" y="72" width="12" height="12"/>
<rect class="unit" x="528" y="96" width="12" height="12"/><rect class="unit" x="552" y="96" width="12" height="12"/><rect class="unit" x="576" y="96" width="12" height="12"/><rect class="unit" x="600" y="96" width="12" height="12"/><rect class="unit" x="624" y="96" width="12" height="12"/><rect class="unit" x="648" y="96" width="12" height="12"/>
<rect class="unit" x="528" y="120" width="12" height="12"/><rect class="unit" x="552" y="120" width="12" height="12"/><rect class="unit" x="576" y="120" width="12" height="12"/><rect class="unit" x="600" y="120" width="12" height="12"/><rect class="unit" x="624" y="120" width="12" height="12"/><rect class="unit" x="648" y="120" width="12" height="12"/>
</g>
</svg>
<div class="text">
<h1 class="name">CareerOS</h1>
<p class="tag">A personal job-hunt OS.</p>
</div>
</div>
</body>
</html>

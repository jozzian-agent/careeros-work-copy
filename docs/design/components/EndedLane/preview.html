<!-- @dsCard group="Jobs board" height=300 subtitle="Collapsed and drag-over" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body{margin:0;padding:24px;background:var(--ground);font-family:var(--font-sans);display:flex;gap:24px;color:var(--ink)}
.lane{box-sizing:border-box;width:168px;min-height:240px;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--radius-400);background:var(--fill-secondary)}
.hd{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--border-interactive)}
.hd h3{margin:0;font:700 16px/22px var(--font-sans)}
.n{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-100);background:var(--surface);font:700 14px/17px var(--font-sans)}
.row{display:flex;justify-content:space-between;font:400 14px/20px var(--font-sans);color:var(--text-neutral)}
.show{min-height:44px;border:0;border-radius:var(--radius-400);background:var(--surface);color:var(--ink);font:700 14px/20px var(--font-sans)}
.hint{font:400 12px/16px var(--font-sans);color:var(--text-subtle)}
.lane.over{background:var(--brand-wash);outline:2px dashed var(--brand);outline-offset:-2px;align-items:center;justify-content:center;text-align:center;font:700 14px/20px var(--font-sans)}
</style>
</head>
<body>
<div class="lane"><div class="hd"><h3>Ended</h3><span class="n">0</span></div><div class="row"><span>Won</span><span>0</span></div><div class="row"><span>Rejected</span><span>0</span></div><div class="row"><span>Stopped</span><span>0</span></div><button class="show">Show</button><span class="hint">Drop a job here to end it</span></div>
<div class="lane over">Drop to end</div>
</body>
</html>

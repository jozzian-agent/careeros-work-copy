<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body{margin:0;padding:24px;background:var(--ground);font-family:var(--font-sans)}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--fill-secondary)}
.i{display:inline-flex;align-items:center;min-height:32px;padding:2px 16px;border:1px solid transparent;border-radius:999px;font:700 14px/17px var(--font-sans);color:var(--ink)}
.i.on{background:var(--surface);border-color:var(--border-interactive);box-shadow:0 1px 3px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="seg" role="group" aria-label="View"><span class="i on" aria-pressed="true">Board</span><span class="i">List</span></div>
</body>
</html>

<!-- @dsCard group="Detail pages" height=100 subtitle="Must-have (filled), nice-to-have (outlined)" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body{margin:0;padding:24px;background:var(--ground);font-family:var(--font-sans);display:flex;gap:12px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;min-height:32px;padding:4px 12px;border-radius:var(--radius-pill);font:400 14px/20px var(--font-sans);color:var(--ink)}
.must{background:var(--fill-secondary);border:1px solid var(--fill-secondary)}
.nice{background:transparent;border:1px solid var(--border-interactive)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<span class="tag must"><span class="sr">Must-have: </span>Marketing technology</span>
<span class="tag nice"><span class="sr">Nice to have: </span>Cohort analysis</span>
</body>
</html>

<!-- @dsCard group="Jobs board" height=240 subtitle="Column header, card and empty column" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body{margin:0;padding:24px;background:var(--ground);font-family:var(--font-sans);display:flex;gap:24px;color:var(--ink)}
.col{width:200px;display:flex;flex-direction:column;gap:12px}
.hd{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--brand)}
.hd h3{margin:0;font:700 16px/22px var(--font-sans)}
.n{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-100);background:var(--fill-secondary);font:700 14px/17px var(--font-sans)}
.card{padding:12px;border:1px solid var(--border-decorative);border-radius:var(--radius-400);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.t{font:700 16px/22px var(--font-sans)}
.m{font:400 14px/20px var(--font-sans);color:var(--text-subtle)}
.empty{padding:16px;border:1px dashed var(--border-interactive);border-radius:var(--radius-400);font:400 14px/20px var(--font-sans);color:var(--text-neutral)}
</style>
</head>
<body>
<div class="col" role="group" aria-label="New, 1 job"><div class="hd"><h3>New</h3><span class="n">1</span></div><div class="card"><span class="t">Product Designer</span><span class="m">Bern · Added today</span></div></div>
<div class="col" role="group" aria-label="Applied, 0 jobs"><div class="hd"><h3>Applied</h3><span class="n">0</span></div><div class="empty">No jobs here yet. Drag a job here.</div></div>
</body>
</html>

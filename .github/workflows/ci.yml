# Career OS CI. Three jobs: `ci`, which is the name the deploy runbook
# refers to, `frontend-dist`, which fails when the committed front-end
# build does not match a fresh one, and `docs-fresh`, which fails when
# the committed generated docs do not match a fresh generator run.
#
# NO STORED SECRETS ANYWHERE IN THIS FILE OR IN WHAT IT RUNS. No
# repository/environment secrets, no LLM key: the suite needs none, and
# a key in CI would be a key in a log. The single `secrets.GITHUB_TOKEN`
# reference below is GitHub's own ephemeral per-workflow token — it is
# minted for one run, scoped to this repo, and expires in an hour.
#
# NO SUBMODULES. `vendor/capa-repo` is a plain folder in this repo since
# PR #2 (2026-10-24); the default checkout already has everything.
#
# Permissions are read-only: nothing here needs to write to the
# repository, so nothing here can.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks-action needs this (read-only) to fetch the PR diff it scans
  # on pull_request events; without it the action hard-fails since its
  # October-2025 breaking update made GITHUB_TOKEN mandatory for PRs.
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # NO LLM VARIABLE IS SET HERE, ON PURPOSE.
      #
      # The suite is mocked at the seam: conftest.py's `offline` fixture
      # makes `urllib.request.build_opener` raise, so a test that reached
      # the network would fail rather than pass slowly, and every test
      # that exercises a model call injects its own client. Exporting
      # LLM_MOCK=1 for the whole job would be worse than useless: it
      # changes what "this environment has no LLM configured" means, and
      # a dozen tests assert exactly that behaviour.
      #
      # `org_intake` lives in vendor/capa-repo, a plain folder now. A
      # local install registers that path with a .pth file in the venv
      # (README.md); in CI there is no venv to register it in, so
      # PYTHONPATH is the same fact by the other route.
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/vendor/capa-repo

    steps:
      # Full history on purpose: gitleaks-action scans the range
      # base^..head on pull_request events, and that range does not exist
      # in a fetch-depth=1 clone (it dies with "unknown revision"). The
      # repo is small enough that the extra fetch is a couple of seconds.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the app and the checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: pytest (product suite)
        # --timeout: a hung test fails in 60s with a stack dump instead of
        # eating the whole job. This is what caught the buffered-pipe hang
        # that once sat in test_deploy_scripts' nightly fixture.
        run: python -m pytest tests/ -q --timeout=60

      - name: pytest (vendored org_intake suite)
        # vendor/capa-repo is ordinary product code now (capa-repo the
        # separate repository is retired), so its tests run here too.
        # Separate invocation on purpose: `tests/test_enrich.py` exists
        # in both trees and pytest refuses to collect two modules of the
        # same name in one run.
        run: python -m pytest vendor/capa-repo/tests/ -q --timeout=60

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck deploy/*.sh
          for script in deploy/*.sh; do bash -n "$script"; done

      - name: i18n catalog check
        # frontend/src/i18n/en.json is read by react-intl on the client
        # and by careeros/i18n.py on the server, and the server side
        # substitutes with str.format. An ICU construct in a value would
        # raise there rather than read as a bad translation, so the
        # catalog is held to plain {var} placeholders and this is the
        # gate that holds it (frontend/src/i18n/README.md).
        run: python scripts/check_i18n.py

      - name: gitleaks
        # Runs on the checkout that is already here, with no
        # GITLEAKS_LICENSE: the free scan is what Part 1 of the deploy
        # runbook relies on in place of GitHub's paid secret scanning for
        # private repos. GITHUB_TOKEN is the ephemeral per-run token (see
        # the header comment), required by the action for PR scans.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  frontend-dist:
    # The committed frontend/dist must be exactly what a fresh build of
    # this commit produces. Node is pinned (frontend/.nvmrc, engines in
    # frontend/package.json); this job enforces the pin and the freshness.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm run build
        working-directory: frontend
        run: npm run build

      - name: committed dist must match the fresh build
        run: |
          status=$(git status --porcelain frontend/dist)
          if [ -n "$status" ]; then
            echo "::error::frontend/dist in the commit does not match a fresh 'npm ci && npm run build':"
            echo "$status"
            exit 1
          fi

  docs-fresh:
    # docs/as-built is read out of the app by scripts/gen_docs.py, so a
    # route that moves without a regenerated doc is a doc that lies. This
    # job regenerates and fails on any diff; the fix is to run the
    # generator and commit what it writes.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # The same fact as in the `ci` job: `org_intake` lives in
      # vendor/capa-repo, careeros/server.py imports it, and there is no
      # venv here for a local install to register that path in.
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/vendor/capa-repo

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the app and the checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Regenerate the as-built docs
        run: python scripts/gen_docs.py

      - name: committed docs must match the fresh run
        run: |
          if ! git diff --exit-code docs/as-built/; then
            echo "::error::docs/as-built/ in the commit does not match a fresh 'python scripts/gen_docs.py': run it and commit the result"
            exit 1
          fi

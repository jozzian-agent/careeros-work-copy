# Curated bulk-export subset of ESCO occupation concepts (Section 4). This is
# an import source used to seed or validate new tags.yaml function-facet
# entries; it is not consulted directly at runtime. Re-confirm esco_uri values
# against the live ESCO portal before relying on them; they are best-citation
# placeholders, not verified facts.
#
# NEEDS OWNER CHECK (proposed 2026-10-15, task M0-1). The four entries that
# existed before this round are ict-product-manager, software-developer,
# ict-service-manager and financial-investment-adviser. Every other entry
# below is a proposal for the owner's own market, which is white-collar work
# in the Zurich region: software, data, product, design, marketing, finance,
# operations, HR, sales engineering and consulting. For each proposed entry
# two things are unverified, and both need the owner or a check against the
# live ESCO portal:
#
#   * the esco_uri, which no entry added in this round carries, so none of
#     them claims an ESCO concept it has not been matched to
#   * the isco code, which is this file's best reading of ISCO-08 and is not
#     a citation
#
# `vault.seed_function_facet` already refuses to treat an entry with no
# esco_uri as ESCO-backed: it seeds such an entry as a local extension with
# a visible marker and with isco cleared (decision 25), so no unverified
# code reaches a vault and no roll-up claims a parent it has not earned.
# Confirming an entry means filling in its esco_uri here and re-running the
# seed, which adds nothing twice and overwrites nothing.
#
# A label or an id below that the owner does not search in is better removed
# than left to bias the extraction prompt, which is given every entry.

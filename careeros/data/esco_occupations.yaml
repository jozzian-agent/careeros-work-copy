# Curated bulk-export subset of ESCO occupation concepts (Section 4). This is
# an import source used to seed or validate new tags.yaml function-facet
# entries; it is not consulted directly at runtime.
#
# THREE KINDS OF ENTRY, told apart by two fields and nothing else:
#
#   * ESCO-BACKED. `esco_uri` filled in, `isco` the first four digits of
#     that concept's own ESCO `code`. Every one of these was fetched from
#     https://ec.europa.eu/esco/api/resource/occupation?uri=<uri>&language=en
#     on the date named beside it, and both its preferred label and its code
#     came back matching what is written here. These are citations.
#   * PROPOSED. `esco_uri: null` and an `isco` that is this file's best
#     reading of ISCO-08, not a citation. Unverified on both counts, and
#     still needing the owner or a portal check. `vault.seed_function_facet`
#     refuses to treat one as ESCO-backed: it seeds the entry as a local
#     extension with a visible marker and with isco cleared (decision 25),
#     so no unverified code reaches a vault and no roll-up claims a parent
#     it has not earned.
#   * LOCAL EXTENSION, `local: true`. An owner label with no ESCO concept at
#     all, so `esco_uri` and `isco` are both null and stay null. Decision 25
#     allows these as owner-governed values with a visible marker, and
#     decision 22 limits the ISCO roll-up guarantee to ESCO-backed entries,
#     which is why these carry no code to roll up: a hand-picked one would
#     be exactly the thing decision 22 forbids. They sit in the "unmapped"
#     bucket of any roll-up report rather than being left out of it. The
#     owner's own ISCO reading for each lives in the golden set, with its
#     confidence, and deliberately not here.
#
# WHY THE LOCAL EXTENSIONS EXIST (2026-10-16, CAREER-29 follow-up). The
# golden-set labelling of the live vault (kept outside the repo at
# ~/careeros-golden-set/golden-set-2026-10-16.csv) produced 15 distinct
# function labels. Validating every URI against the live ESCO API found 10
# real concepts and 5 the labelling model had invented: chief product
# officer, digital transformation manager, innovation officer, embedded
# systems security engineer, digital marketing manager (all five 404). The
# owner's confirmation of draft choices 22-25 that day keeps those five as
# labels, so each has an entry here marked `local: true`. The rule they
# exist to enforce: a label with no ESCO concept must stay expressible on
# its own, and must never be absorbed into an ESCO entry whose ISCO says
# something else. Two such absorptions were in the seed and are gone:
# "Product & Solution Security Expert" landed on ict-security-manager
# (1330) where the golden ISCO is 2529, and a blanket `head of product`
# keyword made ICT product manager (1330) the only home for the two golden
# rows whose label is chief product officer (1223).
#
# WHICH ISCO LEVEL (settled 2026-10-16, CAREER-29). Every `isco` below is a
# four-digit ISCO-08 unit group, which is the finest level the standard has.
# That is the level to record, because draft choice 22 derives ISCO from the
# validated ESCO concept rather than storing a hand-picked code: a coarser
# roll-up (minor group, sub-major, major) is the first three, two or one
# digits of the same code, so the unit group keeps every roll-up available
# while a level-3 code would have thrown the finest one away for good. An
# ESCO code is finer still (`1330.7`, `1221.3.2.1`) and is ESCO's own
# hierarchy rather than ISCO's, so the four digits before the first dot are
# what an entry records.
#
# KEYWORDS ARE PROMPT CONTEXT, NOT A MATCHER (decision 11 defers the
# deterministic matcher). The whole file is handed to the extraction prompt
# (`ingest._function_options_text`), so an id with no lexical anchor for a
# posting the owner actually stores is an id the model will not reach for.
# Two entries may therefore legitimately share a phrase: `head of product`
# anchors both ict-product-manager and chief-product-officer, because the
# golden set splits four Head-of-Product rows two and two, and the posting's
# own text is what tells them apart. Giving one id sole ownership of an
# ambiguous phrase would decide those rows by seed order instead.
#
# A label or an id below that the owner does not search in is better removed
# than left to bias the extraction prompt, which is given every entry.
#
# The entries added on 2026-10-16 are the gaps the owner's own stored
# postings showed: an IT/technology consultant (two postings), a business
# development or strategy manager (three), an innovation manager (two), and
# then the golden set's own labels (the four ESCO concepts the seed had no
# entry for -- product manager, banking products manager, business
# consultant, ICT business analysis manager -- plus the five local
# extensions above). Five existing entries gained keywords for the same
# reason, each one a posting the owner actually stores: 'product owner' and
# 'head of product' (ICT product manager), 'entwickler' (software
# developer), 'channel manager' (sales manager), 'security specialist'
# (security manager) and 'trade control' (compliance officer).
# tests/test_function_facet.py pins the id list and one line per posting
# shape, so a keyword that stops answering for a real posting fails there.
#
# Confirming an entry means filling in its esco_uri here and re-running the
# seed. Since 2026-10-16 that second run is not a no-op: it confirms or
# updates esco_uri, isco and the local-extension marker on an entry the
# vault already holds, and merges in any new keyword, while never touching a
# label the owner edited. Before that fix the seed skipped every id it
# already knew, so a URI filled in here reached no vault at all.
occupations:

  # line at Proton, a product area at LinkedIn) and two are the top product
  # role. See the keyword note in the header.
  - id: ict-product-manager
    label: "ICT product manager"
    label_de: "ICT-Produktmanager"
    isco: "1330"
    esco_uri: "http://data.europa.eu/esco/occupation/a79170ad-0b7b-4697-864f-1748359aa10a"
    keywords: ["product manager", "ict product manager", "software product manager", "produktmanager",
               "product owner", "head of product", "produktmanagement"]

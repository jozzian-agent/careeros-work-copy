grading:
  level: 4
  rule: >-
    Two occupation values match when the first four digits of their codes
    match. A 4-digit value (a job family's own code, see
    occupation_families.yaml) grades against a 5-digit value directly.
open_questions:
  - "The ISCO-08 unit-group titles above were recorded from the standard's
     published structure and not re-checked against the ILO document in
     this ticket. They are titles, not codes -- a wrong title misleads a
     reader, while the codes themselves are what the mapping and the
     grading depend on. TODO: confirm the titles, and pin the CH-ISCO-19
     deep link, in the pass that loads the 5-digit list."
  - "Whether CH-ISCO-19's 5-digit codes are published with an explicit
     ISCO-08 parent column, or whether the parent is the first four digits
     by construction, is unconfirmed. The grading rule above assumes the
     latter."

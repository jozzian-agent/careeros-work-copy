# Occupations (owner decision D1, decision sheet CAREER-58, 2026-10-17):
# store 5-digit CH-ISCO-19 codes, grade at 4 digits.
#
# CH-ISCO-19 is the Swiss occupational nomenclature BFS maintains on top
# of ISCO-08: the first four digits are the international unit group, the
# fifth is the Swiss subdivision. Grading at four digits is what makes
# that split usable -- two postings that agree at the unit group are the
# same occupation for search and similarity, whatever the fifth digit
# says, and the fifth digit is kept because it is the level the Swiss
# source states and throwing it away at write time cannot be undone.
#
# WHAT IS IN THIS FILE, HONESTLY:
#
#   * `isco_minor_group` -- THE 3-DIGIT BACKBONE, loaded in full
#     (CAREER-130, 2026-11-02). All 130 published non-onA minor groups,
#     with their official German and English titles, read from the BFS
#     nomenclature file the owner supplied (ch-isco-19-de-en.xlsx, named
#     under `source_file` below). That file's 1 489 rows carry 175
#     three-digit entries: these 130, plus 45 "onA" buckets ("ohne nähere
#     Angabe" -- not elsewhere classified), which are deliberately NOT
#     loaded, because a code whose meaning is "we did not say" is not a
#     home for a job family. `complete: true`: 130 IS the whole published
#     3-digit backbone, so a caller may safely read a missing code here
#     as an invalid one.
#
#     All 130 codes were cross-checked against the ILO's ISCO-08
#     structure and every one of them exists there. 11 titles differ from
#     the ILO wording by Swiss national usage -- 513 reads "Head waiters,
#     restaurant service workers, service assistants and bartenders" here
#     against the ILO's "Waiters and bartenders" -- and the CH wording is
#     what is kept: this file is the Swiss nomenclature, and for the
#     Swiss nomenclature BFS is the authority, not a convenience.
#   * `isco_unit_group` -- SEED, not the standard. The 19 ISCO-08 unit
#     groups that 35 of the 62 job families in occupation_families.yaml
#     point at, and nothing else: ISCO-08 has 436 unit groups and the
#     other 417 would be dead weight in a product that classifies office
#     and ICT work in Zurich. Marked incomplete for exactly that reason,
#     so no caller reads a missing code as an invalid one. A family
#     mapping that needs a new group adds it here in the same change (the
#     test in tests/test_taxonomy.py fails otherwise).
#
#     IT IS NO LONGER THE BINDING CONSTRAINT, and that is what CAREER-130
#     changed. The family list went from 40 to 62 on 2026-11-02
#     (CAREER-129, CAREER-135) and not one of the new families could be
#     mapped against this seed, because it has no unarguable home for any
#     of them and inventing a four-digit code is what decision 22
#     forbids: 27 of the 62 families carried no code at all. Owner
#     decision 5 was the route out and it is this ticket -- the 3-digit
#     backbone above is loaded, and every one of the 62 families now
#     carries an owner-approved `isco3` (occupation_families.yaml), so
#     every job has a home: cook, electrician, nurse. What is still
#     missing is the FOUR-digit mapping for those 27, which is later work
#     and named as such there, not a gap in this file.
#   * `ch_isco19` -- A STUB, no entries. The 5-digit Swiss list is
#     BFS-published and could not be read in this ticket (no network
#     access). Writing 5-digit codes from memory is the one thing the
#     ticket's rules forbid outright, so the list is empty with the source
#     named below. Nothing stores a 5-digit code until it is loaded.
#
# WHY THE BACKBONE IS SHIPPED DATA RATHER THAN A PREFIX. The arithmetic
# has not changed: a minor group is the first three digits of a unit
# group, the sub-major the first two, the major the first one, and
# nothing derivable is stored (settled 2026-10-16, CAREER-29). The
# 3-digit list is in this file anyway, for two reasons that a prefix
# cannot cover. It carries the official German and English titles, which
# no slice of a code can produce. And 27 of the 62 job families reach
# their 3-digit home DIRECTLY, having no 4-digit code to slice: deriving
# `isco3` from `isco4` would have left exactly the families this ticket
# exists for with nothing.
taxonomy_version: "1.1.0"

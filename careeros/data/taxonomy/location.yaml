# Location (owner decision, decision sheet CAREER-58, 2026-10-17): the
# BFS municipality number, the canton, and coordinates.
#
# WHY THE MUNICIPALITY NUMBER. "Zurich" is written a dozen ways across the
# owner's own stored postings (Zürich, Zurich, 8004 Zürich, Zürich-Oerlikon,
# Opfikon), and PROJECT.md's fixed-list section has been asking for "one
# format" since M1. The BFS Gemeindenummer is that format: a stable
# integer per municipality, with the canton derivable from it through the
# official register, so two spellings of one place become one code.
#
# THE MUNICIPALITY LIST WAS A STUB UNTIL 2026-10-17 and is now loaded.
# CAREER-55 shipped this file with 26 cantons and an empty municipality
# list, because writing two thousand entries from memory would fabricate
# most of them and the register could not be fetched offline. CAREER-53
# needed the numbers to geocode Personio postings, so
# `scripts/load_bfs_municipalities.py` now loads them from the register's
# own machine distribution -- see THE ROUTE below -- and the codes between
# the generated markers are that loader's output, never typed by hand.
#
# THE ROUTE. The BFS register is published as Linked Data in LINDAS (the
# federal Linked Data Service, operated by the Swiss Federal Archives) and
# queryable over the public SPARQL endpoint https://lindas.admin.ch/query
# with no credentials. Two graphs are read:
#
#   * https://lindas.admin.ch/fso/register -- the BFS register itself:
#     every `admin:PoliticalMunicipality`, its official name, and the
#     canton it sits in. Superseded entries carry `version:Deprecated`
#     and are filtered out, so what lands here is the register's current
#     stock and not its history.
#   * https://lindas.admin.ch/territorial -- the LINDAS `municipality`
#     shared dimension (https://ld.admin.ch/dimension/municipality),
#     which carries `schema:postalCode` per municipality. That is the
#     postal-code half, and it is what makes "8004 Zürich" resolvable.
#
# This is the same endpoint and the same owner-accepted reasoning as
# `scripts/seed_zefix_zurich.py` (see its docstring on robots.txt): the
# endpoint is the dataset's own documented query service, the agent
# identifies itself, and the loader makes two requests.
#
# STILL `complete: false`, and the todo says why: the list is the register
# as the loader found it on the date below, and the register changes
# several times a year through mergers. A code in it is real; a code
# missing from it may be a municipality that merged after the load. The
# names are the register's own, including its canton suffixes ("Buchs
# (ZH)", "Wil (SG)"), which is what makes a bare "Buchs" in a posting
# ambiguous rather than wrong -- see `careeros.feeds.geocode`.
taxonomy_version: "1.1.0"
standard: "BFS municipality and canton numbers (Amtliches Gemeindeverzeichnis der Schweiz)"
standard_version: "canton list stable since 1979 (26 cantons); municipality register as published in LINDAS on 2026-10-17"
changed_at: "2026-10-17"
source_url: "https://www.bfs.admin.ch/bfs/de/home/grundlagen/agvch.html"
source_url_confirmed: false
municipality_source:
  endpoint: "https://lindas.admin.ch/query"
  register_graph: "https://lindas.admin.ch/fso/register"
  postal_code_graph: "https://lindas.admin.ch/territorial"
  shared_dimension: "https://ld.admin.ch/dimension/municipality"
  service: "LINDAS, the federal Linked Data Service (Swiss Federal Archives)"
  licence: "OGD Open use. Must provide the source. https://opendata.swiss/en/terms-of-use#terms_by"
  attribution: "Amtliches Gemeindeverzeichnis der Schweiz, Federal Statistical Office (BFS), via LINDAS (https://lindas.admin.ch)"
  loaded_at: "2026-10-17"
  loaded_by: "scripts/load_bfs_municipalities.py"
code_lists:
  # The BFS canton number is the code, as a string, because every other
  # code in this taxonomy is a string and a mixed-type lookup is a trap.
  # The two-letter abbreviation is the one a person reads and the one a
  # posting prints, so it is kept beside it and never instead of it.
  - dimension: canton
    complete: true
    codes:
      - code: "1"
        abbreviation: ZH
        label: "Zürich"
      - code: "2"
        abbreviation: BE
        label: "Bern / Berne"

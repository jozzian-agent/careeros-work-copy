# The shape of one stored location, and which parts are required. Shape
# only: nothing fills it in this ticket.
record:
  fields:
    municipality: "a BFS Gemeindenummer as a string, or null when the posting names only a region"
    canton: "a canton code. Required: a posting that names any Swiss place names a canton implicitly, and the canton is what a filter uses."
    label: "the posting's own place wording, kept verbatim"
    latitude: "WGS84 decimal degrees, or null"
    longitude: "WGS84 decimal degrees, or null"
  coordinates_note: >-
    Coordinates are stored in WGS84 decimal degrees, which is what a map
    and a distance calculation want. The BFS register publishes the Swiss
    LV95 (E/N) system instead, so loading coordinates from it means
    converting them; this file records the target system so the conversion
    happens once, at load, rather than being guessed per reader.
open_questions:
  - "A job outside Switzerland has no BFS number and no canton. Whether a
     non-Swiss location is a country code in the same field or a separate
     dimension is open; the universe is Swiss for now (PROJECT.md M3)."
  - "The canton numbers were recorded from the standing list in CAREER-55
     and are now cross-checked against the register: every canton code a
     loaded municipality sits in is one of the 26 below, and all 26 carry
     at least one municipality (the loader refuses to write otherwise).
     The abbreviations and labels themselves are still the hand-recorded
     ones; TODO: confirm the spellings against the register's own canton
     names."
  - "Coordinates are still null everywhere. The register's LINDAS
     distribution references a municipality's boundary geometry as a URI
     (geo.ld.admin.ch/boundaries/...) and carries no inline point, so
     loading a latitude and longitude means fetching and reducing a
     polygon per municipality. CAREER-53 did not need a point and did not
     invent one."

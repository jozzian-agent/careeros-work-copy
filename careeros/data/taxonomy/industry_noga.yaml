# Industry (owner decision D2, decision sheet CAREER-58, 2026-10-17):
# NOGA replaces the ISIC sections. A record stores the 2-DIGIT DIVISION;
# the section is derived from it.
#
# WHY DIVISIONS. A section is 21 buckets for the whole economy, so "J,
# information and communication" holds a telecom operator, a software
# house and a publisher. That is too coarse for the industry filter the
# Jobs board already has. The division is the next level down and is what
# the Swiss register states, so storing the division and deriving the
# section keeps the filter the product has today and makes a finer one
# possible without a second classification pass.
#
# WHAT IS IN THIS FILE, HONESTLY:
#
#   * the 21 sections -- COMPLETE. The letters and labels are the ones
#     this repository already ships in `careeros/data/isic_sections.yaml`,
#     reused verbatim rather than retyped, because NACE Rev. 2 (which NOGA
#     2008 implements) shares ISIC Rev. 4's section letters and titles.
#     That shared level is also what makes D2 cheap: a company already
#     storing the section letter 'J' keeps a meaningful value.
#   * the divisions -- A STUB, no entries. The BFS NOGA publication could
#     not be read in this ticket (no network access), and the division
#     list is the one place where typing from memory would put a wrong
#     label on a real code. The ticket's own rule is explicit about this
#     case: ship a stub with the source URL and a TODO, never invent
#     entries.
#   * the section-of-division ranges -- RECORDED BUT UNVERIFIED, so that
#     "the section is derived" is implementable the day the divisions
#     land. They are the NOGA 2008 / NACE Rev. 2 structure. Note that the
#     ranges cannot be expanded into a division list: the numbering has
#     gaps (there is no division 34, 40 or 44), so every two-digit number
#     inside a range is NOT a division.
#
# WHICH REVISION IS CURRENT is the second half of D2 and is NOT settled
# here. A NOGA 2025 revision following NACE Rev. 2.1 is reported to have
# been introduced for statistics from reference year 2025, which would
# make NOGA 2008 the predecessor -- but confirming that, and with it which
# revision CareerOS should classify against, needs the BFS page. Until
# then `standard_version` says so in words rather than naming a revision
# this file cannot stand behind. Rev. 2.1 restructured parts of the
# classification, so the ranges below must be re-confirmed against
# whichever revision is adopted, not assumed to carry over.
taxonomy_version: "1.0.0"
standard: "NOGA (Nomenclature générale des activités économiques), the Swiss implementation of NACE"
standard_version: "UNCONFIRMED: NOGA 2008 (NACE Rev. 2) or NOGA 2025 (NACE Rev. 2.1) -- see the header and open_questions"
changed_at: "2026-10-17"
source_url: "https://www.bfs.admin.ch/bfs/en/home/statistics/industry-services/nomenclatures/noga.html"
source_url_confirmed: false
code_lists:

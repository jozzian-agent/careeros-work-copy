# How a section is derived from a division (D2: "sections derived").
# UNVERIFIED: this is the NOGA 2008 / NACE Rev. 2 structure as recorded
# here, not a reading of the BFS document, and NACE Rev. 2.1 changed parts
# of it. Confirm it in the same pass that loads the divisions.
derivation:
  verified: false
  rule: "A division's section is the section whose range contains it. Ranges are inclusive and do not overlap."
  section_of_division:

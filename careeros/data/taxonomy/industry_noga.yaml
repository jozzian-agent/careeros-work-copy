open_questions:
  - "D2 asked which NOGA revision is current. ANSWERED by CAREER-132
     (owner ruling 2026-11-03): NOGA 2025 / NACE Rev. 2.1, 22 sections
     A-V. The live sector table moved to `org_intake`'s
     `noga_sections.yaml`, which company records now store the letters of
     (`vault.known_section_codes`). The dead
     `careeros/data/isic_sections.yaml` copy this file used to call the
     live source is retired by CAREER-132 PR1, not by that change.
     STILL OPEN, and the reason the list above was not retyped: this
     file's own `noga_section` codes and `section_of_division` ranges are
     the NOGA 2008 structure. Nothing reads them yet (the only reader is
     `tests/test_taxonomy.py`'s shape check), and rewriting them needs
     the NACE Rev. 2.1 division numbering from the BFS publication, which
     still could not be fetched. TODO: load the Rev. 2.1 divisions and
     ranges, then replace the 21 letters above with the 22 the live table
     carries, so this dimension and the stored sector letter agree."

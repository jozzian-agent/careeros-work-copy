# How a section is derived from a division (D2: "sections derived").
# UNVERIFIED: this is the NOGA 2008 / NACE Rev. 2 structure as recorded
# here, not a reading of the BFS document, and NACE Rev. 2.1 changed parts
# of it. Confirm it in the same pass that loads the divisions.
derivation:
  verified: false
  rule: "A division's section is the section whose range contains it. Ranges are inclusive and do not overlap."
  section_of_division:
    A: ["01", "03"]
    B: ["05", "09"]
    C: ["10", "33"]
    D: ["35", "35"]
    E: ["36", "39"]
    F: ["41", "43"]
    G: ["45", "47"]
    H: ["49", "53"]
    I: ["55", "56"]
    J: ["58", "63"]
    K: ["64", "66"]
    L: ["68", "68"]
    M: ["69", "75"]
    N: ["77", "82"]
    O: ["84", "84"]
    P: ["85", "85"]
    Q: ["86", "88"]
    R: ["90", "93"]
    S: ["94", "96"]
    T: ["97", "98"]
    U: ["99", "99"]
open_questions:
  - "D2 asks which NOGA revision is current and for it to be recorded.
     Unanswered: it needs the BFS page, which could not be fetched. TODO:
     confirm NOGA 2008 vs NOGA 2025, record it in standard_version, and
     re-confirm the derivation ranges against that revision."
  - "`careeros/data/isic_sections.yaml` is still the live sector source:
     the enrichment cascade keyword-matches against it and company
     records store its letters (`vault.known_section_codes`). D2 is a
     replacement of the standard, not of the stored values, and nothing in
     this ticket migrates or rewires either. The section letters coincide,
     so the two lists do not currently disagree -- but they are two files
     carrying one list, which is a duplicate to remove when the divisions
     land and the ISIC file retires."

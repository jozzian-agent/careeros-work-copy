  - dimension: occupation_family_status
    complete: true
    codes:
      - code: verified
        label: "ESCO-verified"
        description: "isco4 is derived from a validated ESCO concept's own code. A citation."
      - code: proposed
        label: "Proposed"
        description: "A candidate 4-digit group that exists in ISCO-08 but has not been confirmed as the right one, or no 4-digit code at all (v2's new families, which carry an owner-approved isco3 and await their isco4)."
      - code: unmapped
        label: "Unmapped"
        description: "A local extension with no ESCO concept, and therefore no code. Carries a review flag."
open_questions:
  - "27 families (v2's 24 plus the 3 local extensions) carry
     `isco4: null`. The pending-backbone marker they used to carry is
     gone: CAREER-130 loaded the 130-group 3-digit backbone and the owner
     approved a mapping, so each of them has an `isco3` and some have
     `isco3_alts`. What is open is the FOUR-digit code, which decision 22
     wants derived from an ESCO concept rather than picked by hand, so it
     waits on the ESCO work the next open question describes. Until then
     those 27 are gradable at the family level and at three digits and
     land in the unmapped bucket at four."
  - "26 of the 62 families are `proposed` WITH a candidate 4-digit code.
     Confirming one means finding its ESCO concept, taking the first four
     digits of that concept's code, and filling in `esco_uri` in
     esco_occupations.yaml -- the route CAREER-29 already documented --
     after which this file's status follows. The five
     `mapping_uncertain` markers are where the answer is likely to be a
     different code rather than the same one confirmed."
  - "The 24 new `label_de` values are translations made in this change,
     not the owner's own words: the v2 draft gives English labels and
     synonyms only. They are filled rather than left null because the
     extraction prompt hands label_de to the model, and a family with no
     German anchor costs a reading on a German posting. TODO: owner
     confirms or corrects the 24."
  - "`synonyms` has no runtime reader yet beyond the tests. Owner
     decision 4 makes it part of the family data model and the two
     readers it is for are not built here: the family-suggestion queue
     (the model proposes a role name when none fits, the owner approves)
     and the replacement for the keyword-matching rules layer, which the
     v2 draft says needs replacing rather than tuning. Until then a
     synonym is a recorded owner word and nothing else -- and never a
     stored value."
  - "D1 says store 5-digit codes and grade at 4. Nothing stores a 5-digit
     code yet, because the CH-ISCO-19 extension list is a stub
     (ch_isco19.yaml). Until it lands, the family's own 4-digit code is
     the finest level the product has."

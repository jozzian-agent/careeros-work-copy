open_questions:
  - "25 of 40 families are `proposed`. Confirming one means finding its
     ESCO concept, taking the first four digits of that concept's code,
     and filling in `esco_uri` in esco_occupations.yaml -- the route
     CAREER-29 already documented -- after which this file's status
     follows. The five `mapping_uncertain` markers are where the answer is
     likely to be a different code rather than the same one confirmed."
  - "D1 says store 5-digit codes and grade at 4. Nothing stores a 5-digit
     code yet, because the CH-ISCO-19 extension list is a stub
     (ch_isco19.yaml). Until it lands, the family's own 4-digit code is
     the finest level the product has."

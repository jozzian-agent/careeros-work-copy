# Job families (owner decision D1, decision sheet CAREER-58, 2026-10-17):
# the existing 40-value `function` facet, read as the CareerOS job-family
# layer, with each family's ISCO-08 unit group beside it.
#
# WHERE THIS SITS. D1 settles three levels and this file is the middle one:
#
#   * CH-ISCO-19, 5 digits -- what a classified job stores. Graded at 4.
#     See ch_isco19.yaml (the Swiss 5-digit extension is a stub there).
#   * the job family -- this file. The owner's own 40 labels, which is
#     what a person searches in ("ICT project manager"), each mapped to
#     one 4-digit ISCO-08 unit group so a family and a 5-digit code can be
#     compared at the grading level.
#   * the ISCO roll-up -- a prefix of the 4-digit code (minor group, sub-
#     major, major), so nothing needs storing for it.
#
# THIS FILE AND esco_occupations.yaml HOLD THE SAME 40 IDS, on purpose and
# not as a duplicate to tidy away: the seed file is the EXTRACTION source
# (keywords handed to the prompt, the ESCO citation behind each entry, and
# the note explaining each local extension) and the facet in the vault is
# the runtime registry seeded from it. This file is the TAXONOMY layer: the
# id, its ISCO mapping and how much that mapping can be trusted. The two
# are kept from drifting by a test rather than by a comment --
# `tests/test_taxonomy.py` asserts that every family here exists in the
# seed with the same label, the same isco and a consistent status, so an
# edit to one file that the other does not follow fails the suite.
#
# STATUS, which is the whole point of the file:
#
#   * verified (10) -- the seed's ESCO-backed entries. `isco4` is the
#     first four digits of a real ESCO concept's own code, fetched from
#     the live ESCO API on 2026-10-16, and `esco_uri` is the citation.
#   * proposed (25) -- a candidate code, not a citation. Every one was
#     checked here against the ISCO-08 unit groups recorded in
#     ch_isco19.yaml, so no family points at a group that does not exist
#     and no family is unmapped by accident; what is still missing is
#     confirmation that the group is the RIGHT one, which needs the ESCO
#     portal or the ILO document. Four carry a `review` marker where that
#     confirmation is more than a formality -- see them below.
#   * unmapped (5) -- the `local: true` labels whose golden-set ESCO URIs
#     404. D1 says leave them unmapped with a review flag, and that is
#     what `review: unmapped_local_extension` is. Decision 22 scopes the
#     ISCO roll-up guarantee to ESCO-backed entries and decision 25 keeps
#     these labels expressible, so a hand-picked code here is exactly the
#     thing both forbid. They sit in the "unmapped" bucket of any roll-up
#     report rather than being left out of it.
#
# A family is single-valued per job in the sense that one code is graded;
# a posting covering two roles carries the `multi_role` flag (see
# value_record.yaml) rather than a second family.

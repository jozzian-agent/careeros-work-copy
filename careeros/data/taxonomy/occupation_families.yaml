# Job families, v2: 62 families as data (owner decisions 2026-11-02,
# CAREER-129; CAREER-135 added `software-engineer` as the 62nd the same
# day), replacing v1's 40 (owner decision D1, decision sheet
# CAREER-58, 2026-10-17). Each one carries an owner-approved 3-digit
# CH-ISCO-19 minor group since CAREER-130, also 2026-11-02 (`isco3`, plus
# `isco3_alts` where a family reaches more than one group).
#
# WHY V2. The owner labelled 50 random postings blind and compared them
# with the pipeline: 7 correct, 16 the wrong family, and 14 where the
# pipeline forced a family onto a posting the owner said none of the 40
# could express. About 35% of the wider 150-posting sample came back
# `unknown`, mostly jobs no family had a home for -- because v1 is the
# ICT/business `function` facet and the universe is not. So the list
# grows to 61, three families that split one function by LEVEL are merged
# away, and a posting now carries up to three families instead of one.
#
# THE THREE DECISIONS THIS FILE IMPLEMENTS:
#
#   1. A seniority or level word is never part of a family name (junior,
#      senior, head, chief, team lead). Seniority and the people-lead
#      flag are dimensions of their own (seniority.yaml). This is what
#      merges the three families below away: each was its own family only
#      because of the rank word in it.
#   2. `intern` is NOT a family. It is a contract type and already exists
#      as `internship` in contract.yaml, findable on its own; the family
#      stays whatever the intern does.
#   3. Up to THREE families per job, ranked. See value_record.yaml's
#      `ranked` field: the primary family is the record's own `value`, so
#      nothing that reads one family had to change. A filter matches any
#      of the three, and the pipeline is scored by "the owner's family is
#      in the top 3" (careeros/classify/grade.py reports top-1 and top-3
#      separately).
#
# MERGED AWAY (3), each absorbed by the family whose meaning already
# covered it. The absorbed label survives as a `synonyms` entry, so a
# golden-set row or a posting using the old words still has somewhere to
# land, and `scripts/migrate_family_taxonomy_v2.py` rewrites a stored
# vault:
#
#     chief-product-officer         -> product-manager
#     ict-business-analysis-manager -> ict-business-analyst
#     innovation-officer            -> innovation-manager
#
# One real cost, recorded rather than hidden: ict-business-analysis-manager
# was ESCO-VERIFIED (concept 2511.7) and ict-business-analyst is not, so
# the merge takes the verified count from 10 to 9. The citation is not
# inherited -- "ICT business analysis manager" and "ICT business analyst"
# are two different ESCO concepts, and pointing the surviving family at
# the absorbed one's URI would be a false citation.
#
# WHERE THIS SITS. Four levels, and this file is the one that maps
# between them:
#
#   * CH-ISCO-19, 5 digits -- what a classified job stores. Graded at 4.
#     See ch_isco19.yaml (the Swiss 5-digit extension is a stub there).
#   * the job family -- this file. The owner's own 62 labels, which is
#     what a person searches in ("ICT project manager"), each mapped to
#     one 4-digit ISCO-08 unit group where a mapping exists, so a family
#     and a 5-digit code can be compared at the grading level.
#   * the ISCO MINOR GROUP, 3 digits -- `isco3` here, and shipped data in
#     ch_isco19.yaml since CAREER-130 rather than a prefix of `isco4`,
#     because 27 families have no `isco4` to take a prefix of and because
#     the 3-digit level carries official German and English titles. Every
#     family has one, owner-approved; 20 of them also carry
#     `isco3_alts`, the other groups the family genuinely reaches.
#   * the coarser ISCO roll-ups -- sub-major and major are prefixes of
#     the minor group, so nothing is stored for them.
#
# THIS FILE AND esco_occupations.yaml HOLD THE SAME 62 IDS, on purpose and
# not as a duplicate to tidy away: the seed file is the EXTRACTION source
# (keywords handed to the prompt, the ESCO citation behind each entry, and
# the note explaining each local extension) and the facet in the vault is
# the runtime registry seeded from it. This file is the TAXONOMY layer: the
# id, its ISCO mapping and how much that mapping can be trusted. The two
# are kept from drifting by a test rather than by a comment --
# `tests/test_taxonomy.py` asserts that every family here exists in the
# seed with the same label, the same isco and a consistent status, so an
# edit to one file that the other does not follow fails the suite.
#
# STATUS, which is the whole point of the file:
#
#   * verified (9) -- the seed's ESCO-backed entries. `isco4` is the
#     first four digits of a real ESCO concept's own code, fetched from
#     the live ESCO API on 2026-10-16, and `esco_uri` is the citation.
#   * proposed (50) -- a candidate 4-digit code, or none yet. Two kinds,
#     told apart by `isco4`:
#       - 26 carry an `isco4` that was checked here against the ISCO-08
#         unit groups recorded in ch_isco19.yaml, so no family points at
#         a group that does not exist; what is still missing is
#         confirmation that the group is the RIGHT one. Five carry a
#         `review: mapping_uncertain` where that is more than a
#         formality.
#       - 24 are v2's new families and carry `isco4: null`. They are NOT
#         unmapped any more: each has an owner-approved `isco3` since
#         CAREER-130, and what they are missing is the 4-digit code. See
#         the next paragraph.
#   * unmapped (3) -- the `local: true` labels whose golden-set ESCO URIs
#     404. D1 says leave them unmapped with a review flag, and that is
#     what `review: unmapped_local_extension` is. Decision 22 scopes the
#     ISCO roll-up guarantee to ESCO-backed entries and decision 25 keeps
#     these labels expressible, so a hand-picked code here is exactly the
#     thing both forbid. They sit in the "unmapped" bucket of any roll-up
#     report rather than being left out of it.
#
# EVERY FAMILY NOW HAS A HOME, AT THREE DIGITS (CAREER-130, owner-approved
# mapping of 2026-11-02). Until this change ch_isco19.yaml shipped nothing
# but a SEED of 19 unit groups -- the ones v1's families happened to need
# -- a family could only point at a group already in it, and 27 of the 62
# families had no unarguable home there, so they carried no code at all.
# The backbone load is the route out owner decision 5 named: all 130
# published 3-digit CH-ISCO-19 minor groups are now data, the owner
# reviewed and approved the family-to-backbone mapping many-to-many, and
# every one of the 62 families carries `isco3` plus, where the family
# genuinely spans more than one group, `isco3_alts`. The two worked
# examples that used to stand here as reasons NOT to map are what the
# mapping answers:
#
#   * `legal` is 261 (legal professionals) with 341 (legal, social and
#     religious associate professionals) as an alternate -- the group
#     2611 (lawyers) rolls up into, rather than the 2619 "not elsewhere
#     classified" demotion the 19-group seed forced.
#   * `ai-ml-engineer` is 251 (software and applications developers and
#     analysts) with 212 (mathematicians, actuaries and statisticians).
#     The 2512-or-2511 question the seed could not answer is a FOUR-digit
#     question; at three digits both readings are 251 and the second
#     reading is recorded as the alternate.
#
# WHAT IS STILL MISSING IS THE FOUR-DIGIT MAPPING, for the same 27
# families and for a narrower reason: 4-digit codes are derived from an
# ESCO concept (decision 22) and these labels have none yet, so a code
# here would still be hand-picked. Those 27 are gradable at the family
# level and at three digits, and they remain in the unmapped bucket at
# four (careeros/classify/grade.py:unmapped_families), which is the
# honest state and not a gap.
#
# SYNONYMS. `synonyms` is new in v2 (owner decision 4: a family is a data
# entry of code, label, synonyms, ISCO mapping and version). It is for
# MATCHING AND PROMPTING ONLY and is never a stored value: a synonym is
# another way to say a family, not a family. `taxonomy.valid_code` does
# not know them and `make_value_record` refuses one, which
# tests/test_taxonomy.py pins. Only the synonyms the owner actually wrote
# are here -- the draft's own parentheticals plus the three absorbed
# labels -- because an invented synonym is an invented claim about what
# the owner searches in.
#
# label_de HONESTY. The 37 kept families carry the German labels v1
# shipped. The owner's v2 draft gives English labels and synonyms and no
# German at all, so the 24 new `label_de` values are TRANSLATIONS made in
# this change, not the owner's own words. They are filled rather than
# left null because the extraction prompt hands label_de to the model
# (careeros/ingest.py:_function_options_text) and a missing German anchor
# costs a reading; they are listed under open_questions for owner
# confirmation rather than presented as settled.
taxonomy_version: "1.3.0"
standard: "CareerOS job families over CH-ISCO-19 minor groups and ISCO-08 unit groups"
standard_version: "family list v2 + software-engineer, owner-approved 2026-11-02 (CAREER-129, CAREER-135); CH-ISCO-19 3-digit minor groups (CAREER-130); ISCO-08 unit groups"
changed_at: "2026-11-02"

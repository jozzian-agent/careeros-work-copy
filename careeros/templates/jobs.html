<div class="page-header"><h1>Jobs</h1><div class="row"><div class="row" aria-label="Job view" id="view-toggle"><button data-view="board" aria-pressed="true">Board</button><button data-view="list" aria-pressed="false">List</button></div><button id="enrich-pending">Enrich pending</button></div></div>
<form novalidate id="intake" class="card row"><label for="posting">Posting URL</label><input id="posting" type="url" placeholder="https://company.example/careers/role" required><button class="primary">Add</button></form>
<div class="row spaced" aria-label="Filter jobs"><button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>{% for status in statuses %}<button class="filter-btn" data-filter="{{ status }}" aria-pressed="false">{{ status|title }}</button>{% endfor %}</div>
<div id="cards" class="spaced">{% include 'job_cards.html' %}</div><p id="empty" class="muted" {% if entries %}hidden{% endif %}>{{ empty }}</p><p id="filter-empty" class="muted" hidden>No jobs in this status.</p>
<script>
let activeFilter='all',activeView='board';
try{activeView=localStorage.getItem('careerJobsView')==='list'?'list':'board';}catch{}
function filter(){let count=0;document.querySelectorAll('.job-card,.job-row').forEach(c=>{c.hidden=activeFilter!=='all'&&c.dataset.status!==activeFilter;if(!c.hidden)count++;});document.querySelectorAll('[data-column]').forEach(c=>c.hidden=activeFilter!=='all'&&c.dataset.column!==activeFilter);document.getElementById('filter-empty').hidden=count>0||activeFilter==='all';}
function view(){document.getElementById('board-view').hidden=activeView!=='board';document.getElementById('list-view').hidden=activeView!=='list';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===activeView)));}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;try{localStorage.setItem('careerJobsView',activeView);}catch{}view();});view();
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});filter();});
let sortColumn=null,ascending=true;
function sortJobs(column,direction){ascending=direction===undefined?(sortColumn===column?!ascending:true):direction;sortColumn=column;const body=document.querySelector('.jobs-table tbody');Array.from(body.rows).sort((a,b)=>a.cells[column].textContent.trim().localeCompare(b.cells[column].textContent.trim(),undefined,{numeric:true})*(ascending?1:-1)).forEach(row=>body.append(row));document.querySelectorAll('.jobs-table th').forEach((th,i)=>th.setAttribute('aria-sort',i===column?(ascending?'ascending':'descending'):'none'));document.getElementById('job-sort').value=column+':'+(ascending?'asc':'desc');}
document.getElementById('cards').addEventListener('click',e=>{const b=e.target.closest('[data-sort]');if(b)sortJobs(Number(b.dataset.sort));});
document.getElementById('cards').addEventListener('change',e=>{if(e.target.id==='job-sort'){const [column,direction]=e.target.value.split(':');sortJobs(Number(column),direction==='asc');}});

async function refresh(){const response=await fetch('/jobs');if(!response.ok)throw Error('Reload to refresh jobs.');const doc=new DOMParser().parseFromString(await response.text(),'text/html');document.getElementById('cards').replaceChildren(...doc.getElementById('cards').children);document.getElementById('empty').hidden=!!document.querySelector('.job-card');filter();view();}
document.getElementById('intake').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button'),input=document.getElementById('posting');button.disabled=true;try{await api('/api/jobs/intake','POST',{url:input.value});await refresh();input.value='';toast('Job added');}catch(err){toast(err.message,true);}finally{button.disabled=false;}};
document.getElementById('enrich-pending').onclick=async e=>{const button=e.currentTarget,ids=Array.from(document.querySelectorAll((activeView==='board'?'.job-card':'.job-row')+'[data-pending="true"]')).filter(c=>!c.hidden).map(c=>c.dataset.id);button.disabled=true;let updated=0,failed=0;try{for(const id of ids){try{await api('/api/jobs/'+encodeURIComponent(id)+'/enrich','POST');updated++;}catch{failed++;}}await refresh();toast(updated+' updated, '+failed+' failed',failed>0);}catch(err){toast(updated+' updated, '+failed+' failed. '+err.message,true);}finally{button.disabled=false;}};
</script>

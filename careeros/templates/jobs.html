<div class="page-header"><h1>Jobs</h1><div class="row"><div class="row" aria-label="Job view" id="view-toggle"><button data-view="board" aria-pressed="true">Board</button><button data-view="list" aria-pressed="false">List</button></div></div></div>
<form novalidate id="intake" class="card row"><label for="posting">Add a job by link or title</label><input id="posting" type="url" placeholder="https://company.example/careers/role" required><button class="primary">Add</button></form>
<dialog id="duplicate-warning"><h2>Possible duplicate</h2><p id="duplicate-message"></p><div class="row">
<button id="duplicate-open-existing" hidden>Open existing</button>
<button id="duplicate-promote" hidden>Promote to pipeline</button>
<button id="duplicate-add-anyway">Add anyway</button>
<button id="duplicate-cancel" autofocus>Cancel</button>
</div></dialog>
<div class="row spaced" aria-label="Filter jobs"><label for="function-filter">Function<select id="function-filter"><option value="all">All functions</option>{% for fid, label in function_options %}<option value="{{ fid }}">{{ label }}</option>{% endfor %}</select></label><button id="needs-attention-toggle" class="filter-btn" aria-pressed="false">Needs attention</button></div>
<div id="cards" class="spaced">{% include 'job_cards.html' %}</div><p id="empty" class="muted" {% if entries %}hidden{% endif %}>{{ empty }}</p><p id="needs-attention-empty" class="muted" hidden>Nothing needs attention.</p>
<script>
let activeView='board',activeFunction='all',needsAttention=false;
try{activeView=localStorage.getItem('careerJobsView')==='list'?'list':'board';}catch{}
try{needsAttention=localStorage.getItem('careerNeedsAttention')==='true';}catch{}
function filter(){let count=0;document.querySelectorAll('.job-card,.job-row').forEach(c=>{const functions=(c.dataset.function||'').split(' ').filter(Boolean);const functionOk=activeFunction==='all'||functions.includes(activeFunction);const needsOk=!needsAttention||c.dataset.needs==='true';c.hidden=!(functionOk&&needsOk);if(!c.hidden)count++;});document.getElementById('needs-attention-empty').hidden=count>0||!needsAttention;}
document.getElementById('function-filter').onchange=e=>{activeFunction=e.target.value;filter();};
function view(){document.getElementById('board-view').hidden=activeView!=='board';document.getElementById('list-view').hidden=activeView!=='list';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===activeView)));}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;try{localStorage.setItem('careerJobsView',activeView);}catch{}view();});view();
const needsToggle=document.getElementById('needs-attention-toggle');
needsToggle.setAttribute('aria-pressed',String(needsAttention));
needsToggle.classList.toggle('active',needsAttention);
needsToggle.onclick=()=>{needsAttention=!needsAttention;needsToggle.setAttribute('aria-pressed',String(needsAttention));needsToggle.classList.toggle('active',needsAttention);try{localStorage.setItem('careerNeedsAttention',String(needsAttention));}catch{}filter();};
filter();
let sortColumn=null,ascending=true;
function sortJobs(column,direction){ascending=direction===undefined?(sortColumn===column?!ascending:true):direction;sortColumn=column;const body=document.querySelector('.jobs-table tbody');Array.from(body.rows).sort((a,b)=>a.cells[column].textContent.trim().localeCompare(b.cells[column].textContent.trim(),undefined,{numeric:true})*(ascending?1:-1)).forEach(row=>body.append(row));document.querySelectorAll('.jobs-table th').forEach((th,i)=>th.setAttribute('aria-sort',i===column?(ascending?'ascending':'descending'):'none'));document.getElementById('job-sort').value=column+':'+(ascending?'asc':'desc');}
document.getElementById('cards').addEventListener('click',e=>{const b=e.target.closest('[data-sort]');if(b)sortJobs(Number(b.dataset.sort));});
document.getElementById('cards').addEventListener('change',e=>{if(e.target.id==='job-sort'){const [column,direction]=e.target.value.split(':');sortJobs(Number(column),direction==='asc');}});

const cards=document.getElementById('cards');
let dragged=null,pendingMoves=0,boardRevision=0,refreshQueued=false,refreshRequest=0;
function counts(){document.querySelectorAll('[data-column]').forEach(column=>column.querySelector('.column-count').textContent=column.querySelectorAll('.job-card').length);}
function clearDrag(){document.querySelectorAll('.drag-over').forEach(column=>column.classList.remove('drag-over'));}
async function moveJob(card,status){
    const previous=card.dataset.status,select=card.querySelector('.job-status');
    if(card.getAttribute('aria-busy')==='true'||status===previous){select.value=previous;return;}
    const target=Array.from(document.querySelectorAll('[data-column]')).find(column=>column.dataset.column===status);
    if(!target){select.value=previous;return;}
    const origin=card.parentNode,next=card.nextSibling,row=Array.from(document.querySelectorAll('.job-row')).find(row=>row.dataset.id===card.dataset.id),focused=document.activeElement;
    function sync(value){card.dataset.status=value;select.value=value;if(row){row.dataset.status=value;row.querySelector('[data-label="Status"] .chip').textContent=value;}counts();filter();if(sortColumn!==null)sortJobs(sortColumn,ascending);}
    pendingMoves++;boardRevision++;card.setAttribute('aria-busy','true');select.disabled=true;card.draggable=false;
    target.append(card);sync(status);
    try{const url='/api/jobs/'+encodeURIComponent(card.dataset.id);await api(url,'PUT',{status});toast('Status updated');}
    catch(err){origin.insertBefore(card,next&&next.parentNode===origin?next:null);sync(previous);toast(err.message,true);}
    finally{card.removeAttribute('aria-busy');select.disabled=false;card.draggable=true;pendingMoves--;boardRevision++;if(focused===select&&!card.hidden)select.focus();if(!pendingMoves&&refreshQueued){refreshQueued=false;refresh().catch(err=>toast(err.message,true));}}
}
cards.addEventListener('change',e=>{if(e.target.matches('.job-status'))moveJob(e.target.closest('.job-card'),e.target.value);});
cards.addEventListener('dragstart',e=>{const card=e.target.closest('.job-card');if(!card||e.target.closest('a,select')||card.getAttribute('aria-busy')==='true'){e.preventDefault();return;}dragged=card;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',card.dataset.id);});
cards.addEventListener('dragover',e=>{const column=e.target.closest('[data-column]');if(!dragged||!column)return;e.preventDefault();e.dataTransfer.dropEffect='move';clearDrag();column.classList.add('drag-over');});
cards.addEventListener('dragleave',e=>{const column=e.target.closest('[data-column]');if(column&&!column.contains(e.relatedTarget))column.classList.remove('drag-over');});
cards.addEventListener('drop',e=>{const column=e.target.closest('[data-column]'),card=dragged;if(!card||!column)return;e.preventDefault();dragged=null;clearDrag();moveJob(card,column.dataset.column);});
cards.addEventListener('dragend',()=>{dragged=null;clearDrag();if(refreshQueued&&!pendingMoves){refreshQueued=false;refresh().catch(err=>toast(err.message,true));}});
async function refresh(){
    if(pendingMoves||dragged){refreshQueued=true;return;}
    const revision=boardRevision,request=++refreshRequest,response=await fetch('/jobs',{cache:'no-store'});
    if(!response.ok)throw Error('Reload to refresh jobs.');
    const doc=new DOMParser().parseFromString(await response.text(),'text/html');
    if(request!==refreshRequest)return;
    if(pendingMoves||dragged){refreshQueued=true;return;}
    if(revision!==boardRevision)return refresh();
    cards.replaceChildren(...doc.getElementById('cards').children);document.getElementById('empty').hidden=!!document.querySelector('.job-card');filter();view();if(sortColumn!==null)sortJobs(sortColumn,ascending);
}
window.addEventListener('pageshow',e=>{if(e.persisted)refresh().catch(err=>toast(err.message,true));});
let hiddenAt=document.hidden?Date.now():null;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();}else{const elapsed=hiddenAt===null?0:Date.now()-hiddenAt;hiddenAt=null;if(elapsed>30000)refresh().catch(err=>toast(err.message,true));}});
async function submitIntake(url,force){return api('/api/jobs/intake','POST',force?{url,force:true}:{url});}
const dupDialog=document.getElementById('duplicate-warning'),dupMessage=document.getElementById('duplicate-message'),
      dupOpenExisting=document.getElementById('duplicate-open-existing'),dupPromote=document.getElementById('duplicate-promote'),
      dupAddAnyway=document.getElementById('duplicate-add-anyway'),dupCancel=document.getElementById('duplicate-cancel');
function showDuplicateWarning(result){
  return new Promise(resolve=>{
    const basis=result.basis==='same_ats_posting_id'?'the same posting ID':'the same URL';
    dupMessage.textContent='"'+result.existing.title+'" looks like a job you already have (matched by '+basis+'). Nothing is created until you choose.';
    dupOpenExisting.hidden=!result.actions.includes('open_existing');
    dupPromote.hidden=!result.actions.includes('promote');
    dupAddAnyway.hidden=!result.actions.includes('add_anyway');
    let settled=false;
    function finish(action){
      if(settled)return;settled=true;
      dupOpenExisting.onclick=dupPromote.onclick=dupAddAnyway.onclick=dupCancel.onclick=null;dupDialog.onclose=null;
      if(dupDialog.open)dupDialog.close();
      resolve(action);
    }
    dupOpenExisting.onclick=()=>finish('open_existing');
    dupPromote.onclick=()=>finish('promote');
    dupAddAnyway.onclick=()=>finish('add_anyway');
    dupCancel.onclick=()=>finish('cancel');
    dupDialog.onclose=()=>finish('cancel');
    dupDialog.showModal();
  });
}
document.getElementById('intake').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button'),input=document.getElementById('posting'),url=input.value;button.disabled=true;
try{
  let result=await submitIntake(url,false);
  if(result.duplicate){
    // Explicit warning panel (JOZ-265 fix round, m8): Cancel/Escape is a
    // genuine dismissal that creates nothing; it never falls through to
    // adding a duplicate anyway.
    const action=await showDuplicateWarning(result);
    if(action==='cancel'){return;}
    if(action==='open_existing'){location.href='/jobs/'+encodeURIComponent(result.existing.id);return;}
    if(action==='promote'){
      await api('/api/jobs/'+encodeURIComponent(result.existing.id)+'/promote','POST');
      await refresh();toast('Promoted to pipeline');input.value='';return;
    }
    result=await submitIntake(url,true);
  }
  await refresh();input.value='';toast('Job added');
}catch(err){toast(err.message,true);}finally{button.disabled=false;}};
document.getElementById('cards').addEventListener('click',e=>{const b=e.target.closest('.retry-ingest');if(!b)return;b.disabled=true;api('/api/jobs/'+encodeURIComponent(b.dataset.id)+'/extract','POST').then(()=>refresh()).catch(err=>toast(err.message,true)).finally(()=>b.disabled=false);});
</script>

<div class="page-header"><h1>Companies</h1></div>
<div class="row spaced" aria-label="Filter companies"><label>Sector<select id="sector-filter"><option value="all">All sectors</option>{% for section in isic_sections %}<option value="{{ section.code }}">{{ section.label }}</option>{% endfor %}</select></label><label>Size<select id="size-filter"><option value="all">All sizes</option>{% for sc in size_classes %}<option value="{{ sc }}">{{ sc|title }}</option>{% endfor %}</select></label></div>
<div class="grid spaced" id="company-grid">{% for company in entries %}<a class="card position" href="/companies/{{ company.id|urlencode }}" data-sectors="{{ company.sectors|join(' ') }}" data-size-class="{{ company.size_class or '' }}"><h2>{{ company.name }}</h2><p class="muted">{{ sector_labels.get(company.id)|join(', ') or 'Sector unknown' }} · {{ company.size_range or (company.size_class|title if company.size_class else 'Size unknown') }}</p><span class="chip">{{ counts[company.id] }} open jobs</span></a>{% else %}<p class="muted">{{ empty }}</p>{% endfor %}</div>
<script>
function filterCompanies(){const sector=document.getElementById('sector-filter').value,size=document.getElementById('size-filter').value;document.querySelectorAll('#company-grid [data-sectors]').forEach(card=>{const sectors=card.dataset.sectors.split(' ').filter(Boolean);const sectorOk=sector==='all'||sectors.includes(sector);const sizeOk=size==='all'||card.dataset.sizeClass===size;card.hidden=!(sectorOk&&sizeOk);});}
document.getElementById('sector-filter').onchange=filterCompanies;document.getElementById('size-filter').onchange=filterCompanies;
</script>

<div class="page-header"><h1>Companies</h1></div><div class="grid">{% for company in entries %}<a class="card position" href="/companies/{{ company.id|urlencode }}"><h2>{{ company.name }}</h2><p class="muted">{{ company.sector or 'Sector unknown' }} · {{ company.size or 'Size unknown' }}</p><span class="chip">{{ counts[company.id] }} open jobs</span></a>{% else %}<p class="muted">{{ empty }}</p>{% endfor %}</div>

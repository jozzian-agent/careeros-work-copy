<a href="/companies">← Companies</a><div class="page-header spaced"><h1>{{ company.name }}</h1><span class="muted">{{ company.id }}</span></div>
<form id="company-form" class="card grid">{% for key in ('name','website','sector','size') %}<label>{{ key|title }}<input name="{{ key }}" value="{{ company[key] or '' }}" {% if key=='name' %}required{% endif %}></label>{% endfor %}<label class="wide">Locations (one per line)<textarea name="locations">{{ company.locations|join('\n') }}</textarea></label><label class="wide">Notes<textarea name="notes">{{ company.notes }}</textarea></label><label class="wide">Custom fields (JSON)<textarea name="custom">{{ company.custom|tojson }}</textarea></label><button class="primary">Save profile</button></form>
<section class="card spaced"><h2>Notes</h2>{{ markdown }}</section><h2 class="spaced">Opportunities</h2><div class="grid spaced">{% include 'job_cards.html' %}{% if not entries %}<p class="muted">No linked jobs.</p>{% endif %}</div>
<script>document.getElementById('company-form').onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));data.locations=data.locations.split('\n').map(s=>s.trim()).filter(Boolean);data.custom=JSON.parse(data.custom);for(const key of ['website','sector','size'])data[key]=data[key]||null;await api('/api/companies/'+{{ company.id|tojson }},'PUT',data);sessionStorage.setItem('careerNotice','Profile saved');location.reload();}catch(err){toast(err.message,true);}};const notice=sessionStorage.getItem('careerNotice');if(notice){sessionStorage.removeItem('careerNotice');toast(notice);}</script>

<button type="button" class="danger" id="delete-company">Delete company</button>
<script>document.getElementById('delete-company').onclick=async()=>{if(!confirm('Delete this company?'))return;try{await api('/api/companies/'+{{ company.id|tojson }},'DELETE');location.href='/companies';}catch(err){toast(err.message,true);}};</script>

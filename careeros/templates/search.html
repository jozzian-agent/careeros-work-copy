<div class="page-header"><h1>Search</h1><span class="muted">Updated <span id="updated">{{ data.updated if data and data.updated else '—' }}</span></span></div>
{% if data is none %}<section class="card empty-state"><h2>{{ empty }}</h2><button class="primary spaced" id="create">Create criteria</button></section>
<script>document.getElementById('create').onclick=async()=>{try{await api('/api/search','POST',{});location.reload();}catch(e){toast(e.message,true);}};</script>
{% else %}
<div class="grid">{% for key,label in sections %}<section class="card" data-section="{{ key }}"><div class="page-header"><h2>{{ label }}</h2><button type="button" class="edit" aria-expanded="false">Edit {{ label|lower }}</button></div><ul class="items"></ul><p class="muted empty" hidden>No items yet.</p><form class="row editor" hidden><input aria-label="New {{ label|lower }} item" placeholder="Add an item" required><button>Add</button></form></section>{% endfor %}
<section class="card wide"><h2>Notes</h2><p id="notes-view" class="preserve">{{ data.notes or 'No notes yet.' }}</p><button id="edit-notes">Edit notes</button><form id="notes-form" hidden><label>Notes<textarea id="notes">{{ data.notes }}</textarea></label><div class="row spaced"><button class="primary">Save notes</button><button type="button" id="cancel-notes">Cancel</button></div></form></section></div>
<script>
let criteria={{ data|tojson }},busy=false;const editing=new Set();
function render(){document.querySelectorAll('[data-section]').forEach(section=>{const key=section.dataset.section,ul=section.querySelector('ul');ul.replaceChildren();criteria[key].forEach((value,index)=>{const li=document.createElement('li');const span=document.createElement('span');span.textContent=value;li.append(span);if(editing.has(key)){const b=document.createElement('button');b.textContent='×';b.type='button';b.setAttribute('aria-label','Remove '+value);b.onclick=()=>save(()=>criteria[key].splice(index,1));li.append(' ',b);}ul.append(li);});section.querySelector('.empty').hidden=criteria[key].length>0;section.querySelector('.editor').hidden=!editing.has(key);section.querySelector('.edit').setAttribute('aria-expanded',editing.has(key));section.querySelector('.edit').textContent=editing.has(key)?'Done':'Edit '+section.querySelector('h2').textContent.toLowerCase();});document.getElementById('notes-view').textContent=criteria.notes||'No notes yet.';document.getElementById('updated').textContent=criteria.updated||'—';}
async function save(change){if(busy)return;busy=true;const previous=structuredClone(criteria);change();render();try{criteria=await api('/api/search','POST',criteria);toast('Criteria saved');}catch(e){criteria=previous;toast(e.message,true);}finally{busy=false;render();}}
document.querySelectorAll('[data-section]').forEach(section=>{const key=section.dataset.section;section.querySelector('.edit').onclick=()=>{editing.has(key)?editing.delete(key):editing.add(key);render();};section.querySelector('form').onsubmit=e=>{e.preventDefault();const input=section.querySelector('input');if(input.value.trim()&&!busy){save(()=>criteria[key].push(input.value.trim()));input.value='';}};});
const nf=document.getElementById('notes-form');document.getElementById('edit-notes').onclick=()=>{nf.hidden=false;document.getElementById('notes').focus();};document.getElementById('cancel-notes').onclick=()=>{nf.hidden=true;document.getElementById('notes').value=criteria.notes;};nf.onsubmit=e=>{e.preventDefault();save(()=>criteria.notes=document.getElementById('notes').value);};render();
</script>{% endif %}

<div class="page-header"><h1>Search</h1></div>
{% if data is none %}<section class="card empty-state"><h2>{{ empty }}</h2><button class="primary spaced" id="create">Create criteria</button></section>
<script>document.getElementById('create').onclick=async()=>{try{await api('/api/search','POST',{});location.reload();}catch(e){toast(e.message,true);}};</script>
{% else %}
<style>
.edit-mode-bar { display:flex; justify-content:flex-end; padding:8px 16px; gap:8px; }
ul.items li { padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
ul.items li:last-child { border-bottom:none; }
.items .remove-x { margin-left:12px; color:#f87171; border:none; background:none; cursor:pointer; font-size:16px; vertical-align:middle; padding:0; }
.editor { margin-top:12px; display:flex; width:100%; gap:8px; flex-wrap:nowrap; }
.editor input { flex:1; width:auto; min-width:0; }
.editor button { flex:0 0 auto; }
#notes-edit, #notes-edit label { width:100%; }
#notes { display:block; width:100%; min-height:96px; margin-top:6px; }
</style>
<div class="edit-mode-bar">
<button type="button" class="primary" id="edit-criteria">Edit criteria</button>
<button type="button" id="save-all" hidden>Done</button>
<button type="button" id="cancel-all" hidden>Cancel</button>
</div>
<div class="grid">{% for key,label in sections %}<section class="card" data-section="{{ key }}"><div class="page-header"><h2>{{ label }}</h2></div><ul class="items"></ul><p class="muted empty" hidden>No items yet.</p><form class="row editor" hidden><input aria-label="New {{ label|lower }} item" placeholder="Add an item" required><button>Add</button></form></section>{% endfor %}
<section class="card wide"><h2 id="notes-heading">Notes</h2><p id="notes-view" class="preserve">{{ data.notes or 'No notes yet.' }}</p><div id="notes-edit" hidden><label>Notes<textarea id="notes">{{ data.notes }}</textarea></label></div></section></div>
<script>
let criteria={{ data|tojson }},busy=false,editing=false,backup=null;
const editButton=document.getElementById('edit-criteria');
const doneButton=document.getElementById('save-all');
const cancelButton=document.getElementById('cancel-all');
const notes=document.getElementById('notes');
function render(){
  document.querySelectorAll('[data-section]').forEach(section=>{
    const key=section.dataset.section,ul=section.querySelector('ul');
    ul.replaceChildren();
    criteria[key].forEach((value,index)=>{
      const li=document.createElement('li');
      li.textContent=value;
      if(editing){
        const button=document.createElement('button');
        button.className='remove-x';button.textContent='×';button.type='button';
        button.setAttribute('aria-label','Remove '+value);
        button.onclick=()=>{if(busy||!editing)return;criteria[key].splice(index,1);render();};
        li.append(button);
      }
      ul.append(li);
    });
    section.querySelector('.empty').hidden=criteria[key].length>0;
    section.querySelector('.editor').hidden=!editing;
  });
  editButton.hidden=editing;doneButton.hidden=!editing;cancelButton.hidden=!editing;
  editButton.disabled=doneButton.disabled=cancelButton.disabled=busy;
  document.getElementById('notes-heading').hidden=editing;
  document.getElementById('notes-view').hidden=editing;
  document.getElementById('notes-edit').hidden=!editing;
  document.getElementById('notes-view').textContent=criteria.notes||'No notes yet.';
}
function clearInputs(){document.querySelectorAll('.editor input').forEach(input=>input.value='');}
editButton.onclick=()=>{
  if(busy||editing)return;
  backup=structuredClone(criteria);editing=true;notes.value=criteria.notes||'';render();
};
notes.oninput=()=>{if(editing&&!busy)criteria.notes=notes.value;};
cancelButton.onclick=()=>{
  if(busy||!editing)return;
  criteria=backup;backup=null;editing=false;notes.value=criteria.notes||'';clearInputs();render();
};
doneButton.onclick=async()=>{
  if(busy||!editing)return;
  busy=true;criteria.notes=notes.value;render();
  try{criteria=await api('/api/search','POST',criteria);editing=false;backup=null;toast('Criteria saved');}
  catch(e){toast(e.message,true);/* keep edits, stay in edit mode so the user can retry */}
  finally{busy=false;notes.value=criteria.notes||'';if(!editing)clearInputs();render();}
};
document.querySelectorAll('[data-section]').forEach(section=>{
  const key=section.dataset.section;
  section.querySelector('form').onsubmit=e=>{
    e.preventDefault();const input=section.querySelector('input');
    if(input.value.trim()&&editing&&!busy){criteria[key].push(input.value.trim());input.value='';render();}
  };
});
render();
</script>{% endif %}
